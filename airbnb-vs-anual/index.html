<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airbnb vs Aluguel Anual — Praia Digital</title>
<meta name="description" content="Compare lado a lado a renda de temporada (Airbnb) com o aluguel anual tradicional e ache o ponto de equilíbrio.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:720px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  .vs{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.3rem}
  @media(max-width:600px){.vs{grid-template-columns:1fr}}
  .col{border-radius:14px;padding:1.1rem;text-align:center}
  .col h3{font-size:1rem;margin-bottom:.5rem}
  .a{background:#fff1f2;border:1px solid #fda4af}.b{background:#f0fdf4;border:1px solid #86efac}
  .big{font-size:1.5rem;font-weight:800}
  .win{outline:3px solid #22c55e}
  #verdict{margin-top:1rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.95rem;display:none}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/simulador-roi">← Simulador ROI</a>
</header>
<main>
  <div class="card">
    <h1>🆚 Airbnb vs Aluguel Anual</h1>
    <p class="sub">Qual estratégia rende mais para o seu imóvel no litoral?</p>
    <label>Diária média Airbnb (R$)</label><input type="number" id="diaria" value="450">
    <label>Ocupação anual (%)</label><input type="number" id="oc" value="55">
    <label>Custos mensais da temporada (limpeza, plataforma, manutenção) R$</label><input type="number" id="custos" value="1200">
    <label>Aluguel mensal anual tradicional (R$)</label><input type="number" id="aluguel" value="2200">
    <button onclick="cmp()">Comparar</button>
    <div class="vs" id="vs" style="display:none">
      <div class="col a" id="colA"><h3>🏖️ Temporada (Airbnb)</h3><div class="big" id="vA"></div><small id="dA"></small></div>
      <div class="col b" id="colB"><h3>📄 Aluguel anual</h3><div class="big" id="vB"></div><small id="dB"></small></div>
    </div>
    <div id="verdict"></div>
  </div>
</main>
<script>
var fmt=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
function cmp(){
  var d=parseFloat(document.getElementById('diaria').value)||0;
  var oc=parseFloat(document.getElementById('oc').value)||0;
  var c=parseFloat(document.getElementById('custos').value)||0;
  var al=parseFloat(document.getElementById('aluguel').value)||0;
  var brutaA=d*365*oc/100, taxa=brutaA*0.15, liqA=brutaA-taxa-c*12;
  var liqB=al*12*0.92; // desconto de vacância/admin ~8%
  document.getElementById('vs').style.display='grid';
  document.getElementById('vA').textContent=fmt(liqA);
  document.getElementById('dA').textContent='bruta '+fmt(brutaA)+' − taxa 15% − custos';
  document.getElementById('vB').textContent=fmt(liqB);
  document.getElementById('dB').textContent=fmt(al)+'/mês com ~8% de vacância/admin';
  document.getElementById('colA').classList.toggle('win',liqA>liqB);
  document.getElementById('colB').classList.toggle('win',liqB>=liqA);
  var diff=Math.abs(liqA-liqB);
  var ocBreak=(liqB+c*12)/(d*365*0.85)*100;
  document.getElementById('verdict').style.display='block';
  document.getElementById('verdict').innerHTML=(liqA>liqB
    ? '🏆 <b>Temporada vence por '+fmt(diff)+'/ano</b> — mas exige gestão ativa. '
    : '🏆 <b>Aluguel anual vence por '+fmt(diff)+'/ano</b> — renda previsível e menos trabalho. ')
    +'Ponto de equilíbrio: a temporada empata com <b>'+ocBreak.toFixed(0)+'% de ocupação</b>. Detalhe no <a href="https://praia.digital/simulador-roi" style="color:#0077B6;font-weight:700">Simulador ROI</a>.';
}
</script>
</body>
</html>
